# Test-only operation for the Apollo cache tests: the feed with every field selected inline, so a test
# can read the items directly. The app's own feed query, with fragments, is features/catalog/api/feed.graphql.
query TestFeed($first: Int!, $after: String) {
  feed(first: $first, after: $after) {
    edges {
      cursor
      node {
        __typename
        ... on Product {
          id
          name
          priceCents
        }
        ... on Recipe {
          id
          name
          cookTimeMin
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
